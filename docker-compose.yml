services:
  traininglog:
    build: .
    container_name: traininglog
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
    environment:
      TRAININGLOG_DATA_DIR: /data
      TRAININGLOG_HOST: "0.0.0.0"
      TRAININGLOG_PORT: "8765"
      TRAININGLOG_API_TOKEN: ${TRAININGLOG_API_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

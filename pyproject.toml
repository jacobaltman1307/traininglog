[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traininglog"
version = "0.1.0"
description = "Self-hosted, mobile-first RL experiment tracker tailored for card game training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
traininglog = "traininglog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traininglog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
